# Project profile for Sanoy (sanoy-ai-workflow).
# KEY="value" lines. Inside double quotes, \" is a quote and \\ is a backslash. The hook, the CLI, and the skills all read this file.
# Fill this in once per project (or run /onboard and let Claude propose values).

PROJECT_NAME="My Project"

# Git
DEFAULT_BRANCH="main"            # pull requests target this branch; /feature and /change branch from it
BRANCH_STYLE="feature/<slug>"    # informational; fix/<slug>-<short> and change/<slug>-<short> are derived the same way

# Build and test (empty BUILD_CMD disables the Stop hook)
BUILD_CMD=""                     # e.g. dotnet build MyApp.sln | npm run build | mvn -q compile | go build ./...
TEST_CMD=""                      # e.g. dotnet test | npm test | pytest | go test ./...
TEST_ONE_HINT=""                 # how to run a single test, e.g. "dotnet test tests/X --filter Name~Y" | "npx vitest run path"
ARCH_TEST_CMD=""                 # optional extra gate, e.g. an architecture-rules test project or a lint step
BUILD_EXTRA_ARGS=""              # appended to BUILD_CMD by the hook, e.g. -p:OutDir=.claude/.build/
SOURCE_GLOBS="*.cs *.csproj"     # git pathspecs that make the Stop hook rebuild, e.g. "*.ts *.tsx package.json"

# Pull requests: gh | azdo | gitlab | url | none
PR_MODE="gh"
REPO_WEB_URL=""                  # needed for azdo and url modes, e.g. https://dev.azure.com/org/project/_git/repo

# Work items: github | azdo | none (lets /change pull a work item by number and /ship link it in commits)
WORK_ITEMS="none"
WORK_ITEM_LINK_SYNTAX="#<id>"    # what to put in commits/PRs to link an item: "#<id>" (GitHub) or "AB#<id>" (Azure Boards)

# Slug prefixes (comma separated, optional). Used to derive <MODULE> for work item titles.
MODULE_PREFIXES=""               # e.g. "api-, web-, core-"

# Learning
DEVELOPER_NAME="the developer"   # how the skills refer to you in TODO markers and quiz logs
